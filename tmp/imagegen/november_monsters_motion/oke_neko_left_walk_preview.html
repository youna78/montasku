<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>おけネコ 左向き横歩き</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #221f1d; background: #edf2f4; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(720px, calc(100vw - 32px)); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .stage { aspect-ratio: 1; border: 1px solid #aeb9bc; background-color: #fff; background-image: linear-gradient(45deg,#dfe5e7 25%,transparent 25%),linear-gradient(-45deg,#dfe5e7 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe5e7 75%),linear-gradient(-45deg,transparent 75%,#dfe5e7 75%); background-position: 0 0,0 16px,16px -16px,-16px 0; background-size: 32px 32px; }
    img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
    p { margin: 10px 0 0; color: #59656a; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>おけネコ 左向き横歩き</h1>
    <div class="stage"><img src="oke_neko_left_walk_preview.gif" alt="おけネコ 左向き横歩き"></div>
    <p>1024×1024 / 4フレーム / 440ms / 左上 → 右上 → 左下 → 右下</p>
  </main>
</body>
</html>
